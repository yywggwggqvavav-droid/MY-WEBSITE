<h1>🎮 My Click Game</h1>

<p>Click the button!</p>

<h2>Score: <span id="score">0</span></h2>

<button onclick="addScore()">CLICK ME</button>

<script>
var score = 0;

function addScore() {
    score = score + 1;
    document.getElementById("score").innerHTML = score;
}
</script>
